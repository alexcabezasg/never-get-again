<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#0074c1" />

  <!-- Data flow arrows -->
  <g transform="translate(100,100)">
    <!-- Circular arrows -->
    <path d="M -40,0 A 40,40 0 1,1 40,0" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 40,0 A 40,40 0 1,1 -40,0" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Arrow heads -->
    <path d="M 40,0 L 50,10 L 50,-10 Z" fill="white"/>
    <path d="M -40,0 L -50,10 L -50,-10 Z" fill="white"/>

    <!-- Central cache symbol -->
    <rect x="-15" y="-15" width="30" height="30" fill="white" rx="5"/>
    <rect x="-10" y="-10" width="20" height="20" fill="#0074c1" rx="3"/>
  </g>

  <!-- Text -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">NEVER GET AGAIN</text>
</svg>
